    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("ad-theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
      try {
        const savedMotion = localStorage.getItem("ad-motion-v2");
        document.documentElement.dataset.motion =
          savedMotion === "full"
            ? "full"
            : savedMotion === "reduced"
              ? "reduced"
              : "full";
      } catch {
        document.documentElement.dataset.motion = "full";
      }
    </script>
